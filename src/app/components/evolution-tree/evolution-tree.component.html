<div class="evolution-tree">
  <img [src]="pokemonImage" class="evolution-img">
  <div>{{ pokemonName }}</div>
  @if (nextEvolutions && nextEvolutions.length > 0) {
    @for (nextEvolution of nextEvolutions; track nextEvolution) {
      next
      {{ nextEvolution.name }}
      <app-evolution-tree [evolutionTree]="nextEvolution"></app-evolution-tree>
    }
  }
</div>
