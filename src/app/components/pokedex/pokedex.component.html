<div class="pokedex container">
  <div class="pokedex-header">Look up a Pokemon!</div>
  <div class="pokedex-input-container">
    <input class="pokedex-input" [(ngModel)]="pokemonInput">
    <button mat-flat-button class="pokedex-search button" (click)="getPokemon()">
      <mat-icon [fontIcon]="'search'" class="pokedex-search-icon"></mat-icon>
    </button>
  </div>
</div>
